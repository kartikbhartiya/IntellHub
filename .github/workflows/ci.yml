name: CI

# The repository had no CI at all: 160 tests, an ESLint config, and a predeploy
# checker, none of which ran unless someone remembered. That is how a decorator got
# written, unit-tested, and applied to zero routes.
#
# The gate that matters most here is the Python suite. It carries the leakage
# guards, the temporal-split assertions, the access-control enforcement tests and
# the property test that sweeps every route for person names — the failures that do
# not announce themselves at runtime.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appsail
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match `stack` in appsail/app-config.json. A mismatch means the
          # scikit-learn that builds the artifacts differs from the one that loads
          # them, the registry refuses them, and the container retrains in-process —
          # which does not fit in 512 MB.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: appsail/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run the suite
        run: python -m pytest tests -q

      - name: Model registry must be present and self-describing
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("artifacts/model_registry.json")
          if not p.exists():
              sys.exit("artifacts/model_registry.json is missing — run `python -m ml.train`")
          r = json.loads(p.read_text())
          missing = [k for k in ("models", "data_provenance", "evaluation_policy") if not r.get(k)]
          if missing:
              sys.exit(f"registry is incomplete: {missing}")
          for name, entry in r["models"].items():
              if not entry.get("split"):
                  sys.exit(f"{name} published without a split description")
          print(f"registry ok — {len(r['models'])} models, "
                f"{len(r.get('warnings', []))} warnings recorded")
          PY

  frontend:
    name: Web — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Errors gate; the ~180 pre-existing warnings are documented in
      # eslint.config.mjs and deliberately do not. The anti-fabrication rule is an
      # error, so a reintroduced FALLBACK_/getFallback* fails the build.
      - name: Lint
        run: npx eslint src --max-warnings=-1

      - name: Build
        run: npm run build

  deployability:
    name: Deploy preflight
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Informational only. The checker's main job is validating the 397 MB
      # vendored dependency tree, which is gitignored and therefore absent here, so
      # it cannot pass in CI. Its output still surfaces config drift — a changed
      # memory ceiling or a mangled startup command — early enough to be useful.
      - name: Report deploy configuration drift
        continue-on-error: true
        working-directory: appsail
        run: python predeploy_check.py
